# Publishes the GitHub release of a version tag: the Linux packages (.deb,
# tarball), the Windows installer and SHA256SUMS, with the release notes from
# docs/releases/v<version>.md. The version is the one in the VERSION file, and
# the tag must match it: push the tag v<VERSION> to release (or run the
# workflow by hand, which releases the version of the checked-out commit).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.1
  GHOSTTY_COMMIT: 5813c9461d5af78b6307a1254d00b1bc190eaccd

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check version and notes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists already, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "docs/releases/$TAG.md" || { echo "docs/releases/$TAG.md is missing"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # The fonts are those of the CI: the font tests need a CJK fallback.
      - name: System packages (Gio headers, NSIS, fonts for the tests)
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev \
            fonts-dejavu-core fonts-wqy-zenhei fonts-noto-color-emoji

      - name: Zig
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install ziglang==$ZIG_VERSION
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/bin/zig"
          chmod +x "$HOME/bin/zig"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v6
        if: steps.check.outputs.skip != 'true'
        id: ghostty-cache
        with:
          path: ${{ runner.temp }}/ghostty
          key: libghostty-vt-${{ env.GHOSTTY_COMMIT }}-zig${{ env.ZIG_VERSION }}

      - name: Build libghostty-vt (Linux and Windows)
        if: steps.check.outputs.skip != 'true' && steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          test -f "$RUNNER_TEMP/ghostty/linux/lib/pkgconfig/libghostty-vt-static.pc" ||
            GHOSTTY_SRC="$RUNNER_TEMP/ghostty-src" build/gio/build-libghostty.sh x86_64-linux-gnu.2.34 "$RUNNER_TEMP/ghostty/linux"
          test -f "$RUNNER_TEMP/ghostty/windows/lib/pkgconfig/libghostty-vt-static.pc" ||
            GHOSTTY_SRC="$RUNNER_TEMP/ghostty-src" build/gio/build-libghostty.sh x86_64-windows-gnu "$RUNNER_TEMP/ghostty/windows"

      - uses: actions/cache/save@v6
        if: steps.check.outputs.skip != 'true' && steps.ghostty-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ghostty
          key: libghostty-vt-${{ env.GHOSTTY_COMMIT }}-zig${{ env.ZIG_VERSION }}

      - name: Tests
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ghostty/linux/lib/pkgconfig
        run: |
          go test ./...
          go test -tags ghostty ./internal/gui/term/

      - name: Build Linux packages
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ghostty/linux/lib/pkgconfig
        run: |
          bash build/package-deb.sh "$VERSION"
          bash build/package-tarball.sh "$VERSION"
          # The binary must not need a newer glibc than 2.34.
          objdump -T bin/leanterm | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

      - name: Build Windows installer
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ghostty/windows/lib/pkgconfig
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          bash build/package-windows.sh "$VERSION"

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp "bin/leanterm_${VERSION}_amd64.deb" "bin/leanterm_${VERSION}_linux_amd64.tar.gz" \
             "bin/leanterm_${VERSION}_windows_amd64_setup.exe" dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          # Creates the tag on this commit unless it was pushed already.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "docs/releases/$TAG.md"
